name: qwenpaw-keepalive

on:
  schedule:
    # 每 6 小时运行一次（UTC）。
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: qwenpaw-keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run platform keepalive
        env:
          QP_ACCOUNT: ${{ secrets.QP1_ACCOUNT }}
          QP_PASSWORD: ${{ secrets.QP1_PASSWORD }}
        run: python3 keepalive.py
      - name: Record successful run
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .last-run
          git add .last-run
          git commit -m "keepalive timestamp" || echo "nothing to commit"
          git push
